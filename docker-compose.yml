# docker-compose.yml สำหรับใช้ DeepSeek-R1 บน MacBook Pro + Colima
# ใช้ .env file สำหรับกำหนดค่าตัวแปร
services:
  # Ollama สำหรับรัน DeepSeek-R1
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64  # สำหรับ Apple Silicon
    container_name: ollama-service
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # สำหรับ Colima
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - GPU_LAYERS=${OLLAMA_GPU_LAYERS}
      - METAL=1          # เปิดใช้งาน Metal (GPU)
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY}
          cpus: '${OLLAMA_CPU}'
    networks:
      - llm-network
    restart: unless-stopped

  # OpenWebUI - Web Interface
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    volumes:
      - ./openwebui/data:/app/backend/data
    ports:
      - "${WEBUI_PORT}:8080"
    environment:
      - OLLAMA_API_BASE_URL=http://ollama-service:11434
      - WEBUI_AUTH=true
      - WEBUI_ENDPOINT_OLLAMA=true
      - WEBUI_ENDPOINT_LOCAL=false
      - WEBUI_USER=${WEBUI_USER}
      - WEBUI_PASS=${WEBUI_PASS}
    deploy:
      resources:
        limits:
          memory: ${WEBUI_MEMORY}
          cpus: '${WEBUI_CPU}'
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge